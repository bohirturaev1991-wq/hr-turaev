      <a href="#process" data-i18n="nav.process"></a>
      <a href="#experience" data-i18n="nav.experience"></a>
      <a href="#blog" data-i18n="nav.blog"></a>
      <a href="#contact" data-i18n="nav.contact"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ru">RU</button>
      <button type="button" data-lang="uz">UZ</button>
    </div>
  </div>
</header>

<main id="top">

  <!-- Hero -->
  <section class="hero container">
    <div class="hero__grid">
      <div>
        <p class="eyebrow" data-i18n="hero.eyebrow"></p>
        <h1 data-i18n="hero.title"></h1>
        <p class="lead" data-i18n="hero.lead"></p>
        <div class="hero__actions">

          <a href="#services" class="btn" data-i18n="hero.cta2"></a>

      <img class="hero__photo" src="images/photo.jpg" alt="Bohir Turaev" width="900" height="1349">
    </div>
    <ul class="stats">
      <li><b>1000+</b><span data-i18n="stats.vacancies"></span></li>
      <li><b>3+</b><span data-i18n="stats.years"></span></li>
      <li><b>HRD</b><span data-i18n="stats.role"></span></li>
    </ul>
  </section>

    <div class="grid-2">
      <p data-i18n="about.text"></p>
      <ul class="tags" data-i18n-list="skills"></ul>
    </div>
  </section>

  <!-- Services -->
  <section class="section container" id="services">
    <h2 data-i18n="services.title"></h2>
    <div class="cards cards--2" data-i18n-cards="services"></div>
    <p class="note" data-i18n="services.note"></p>
  </section>

  <!-- Process -->
  <section class="section container" id="process">
    <h2 data-i18n="process.title"></h2>
    <ol class="steps" data-i18n-cards="process"></ol>
  </section>

  <!-- Experience -->
  <section class="section container" id="experience">
    <h2 data-i18n="exp.title"></h2>
    <div class="timeline">
      <div class="timeline__item">
        <div class="timeline__date"><span class="ph">20XX</span> — <span data-i18n="exp.now"></span></div>
        <div>
          <h3 data-i18n="exp.job1.role"></h3>
          <p class="muted" data-i18n="exp.job1.company"></p>
          <p data-i18n="exp.job1.text"></p>
        </div>

      <div class="timeline__item">
        <div class="timeline__date"><span class="ph">20XX — 20XX</span></div>
        <div>
          <h3 class="ph" data-i18n="exp.job2.role"></h3>
          <p class="muted ph" data-i18n="exp.job2.company"></p>
        </div>
      </div>
    </div>

    <h2 class="mt" data-i18n="edu.title"></h2>
    <div class="timeline">
      <div class="timeline__item">
        <div class="timeline__date"><span class="ph">20XX</span></div>
        <div>
          <h3 class="ph" data-i18n="edu.uni"></h3>
          <p class="muted ph" data-i18n="edu.degree"></p>
        </div>
      </div>
      <div class="timeline__item">
        <div class="timeline__date"><span class="ph">20XX</span></div>
        <div>
          <h3 class="ph" data-i18n="edu.cert"></h3>
          <p class="muted ph" data-i18n="edu.certOrg"></p>
        </div>
      </div>
    </div>

  <!-- Cases -->
  <section class="section container" id="cases">
    <h2 data-i18n="cases.title"></h2>
    <div class="cards" data-i18n-cards="cases"></div>
  </section>

  <!-- Clients: text wordmarks; swap for official logo files once permission is given -->
  <section class="section container" id="clients">
    <h2 data-i18n="clients.title"></h2>
    <div class="logos">
      <div class="logos__item">UzAuto</div>
      <div class="logos__item">International School</div>
      <div class="logos__item">CIS</div>

    <h2 data-i18n="reviews.title"></h2>

  <section class="section container">
    <div class="lead-magnet">

    <h2 data-i18n="blog.title"></h2>
    <div class="cards cards--2" data-i18n-cards="blog"></div>

    <h2 data-i18n="contact.title"></h2>
    <p class="lead" data-i18n="contact.lead"></p>
    <div class="contact__links">
      <a href="https://t.me/TuraevBoxir" target="_blank" rel="noopener" class="contact__item">
        <span class="muted">Telegram</span>
        <b>@TuraevBoxir</b>
      </a>
      <a href="tel:+998977410661" class="contact__item">
        <span class="muted" data-i18n="contact.phone"></span>
        <b>+998 97 741 06 61</b>
      </a>
      <a href="mailto:bohirturaev1991@gmail.com" class="contact__item">

      <a href="https://www.linkedin.com/" target="_blank" rel="noopener" class="contact__item">
